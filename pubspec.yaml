name: bit_tools_backend
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  camera: ^0.12.0+2
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  http: ^1.2.1
  url_launcher: ^6.3.0
  google_generative_ai: ^0.4.0
  google_fonts: ^8.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/bit_tool_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/bit_tool_logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/bit_tool_logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/bit_tool_logo.png"
  linux:
    generate: true
    image_path: "assets/bit_tool_logo.png"

flutter_native_splash:
  color: "#F4F8FD"
  image: "assets/splash_logo.png"
  color_dark: "#0E131F"
  image_dark: "assets/splash_logo_dark.png"

  android_12:
    color: "#F4F8FD"
    image: "assets/android12_splash_icon.png"
    color_dark: "#0E131F"
    image_dark: "assets/android12_splash_icon_dark.png"

  web: false

