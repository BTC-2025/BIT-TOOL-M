name: Flutter CI/CD

# ============================================================
# TRIGGERS
# ============================================================

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  # Production release:
  # git tag v1.0.0
  # git push origin v1.0.0
  tags:
    - "v*.*.*"


# ============================================================
# GLOBAL SETTINGS
# ============================================================

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# ============================================================
# JOB 1 — CODE QUALITY + TESTS
# ============================================================

jobs:

  quality:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Setup Flutter
      # --------------------------------------------------------

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          cache: true
          cache-sdk: true


      # --------------------------------------------------------
      # Show Flutter version
      # --------------------------------------------------------

      - name: Flutter version
        run: flutter --version


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: flutter pub get


      # --------------------------------------------------------
      # Check Dart formatting
      # --------------------------------------------------------

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .


      # --------------------------------------------------------
      # Static analysis
      # --------------------------------------------------------

      - name: Flutter analyze
        run: flutter analyze


      # --------------------------------------------------------
      # Run tests
      # --------------------------------------------------------

      - name: Flutter tests
        run: flutter test


# ============================================================
# JOB 2 — ANDROID BUILD
# ============================================================

  android:
    name: Android Build
    runs-on: ubuntu-latest

    needs:
      - quality

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Setup Flutter
      # --------------------------------------------------------

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          cache: true
          cache-sdk: true


      # --------------------------------------------------------
      # Flutter dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: flutter pub get


      # --------------------------------------------------------
      # Build APK
      # --------------------------------------------------------

      - name: Build Android APK
        run: flutter build apk --release


      # --------------------------------------------------------
      # Build Android App Bundle
      # --------------------------------------------------------

      - name: Build Android App Bundle
        run: flutter build appbundle --release


      # --------------------------------------------------------
      # Upload APK
      # --------------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk


      # --------------------------------------------------------
      # Upload AAB
      # --------------------------------------------------------

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab


# ============================================================
# JOB 3 — iOS BUILD
# ============================================================

  ios:
    name: iOS Build
    runs-on: macos-latest

    needs:
      - quality

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Setup Flutter
      # --------------------------------------------------------

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          cache: true
          cache-sdk: true


      # --------------------------------------------------------
      # Flutter dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: flutter pub get


      # --------------------------------------------------------
      # Build iOS
      #
      # --no-codesign means this validates the iOS project
      # without requiring Apple certificates/provisioning profiles.
      # --------------------------------------------------------

      - name: Build iOS
        run: flutter build ios --release --no-codesign


# ============================================================
# JOB 4 — WEB BUILD
# ============================================================

  web:
    name: Flutter Web Build
    runs-on: ubuntu-latest

    needs:
      - quality

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Setup Flutter
      # --------------------------------------------------------

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          cache: true
          cache-sdk: true


      # --------------------------------------------------------
      # Flutter dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: flutter pub get


      # --------------------------------------------------------
      # Build Web
      # --------------------------------------------------------

      - name: Build Flutter Web
        run: flutter build web --release


      # --------------------------------------------------------
      # Upload Web build
      # --------------------------------------------------------

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: build/web


# ============================================================
# JOB 5 — LINUX BUILD
# ============================================================

  linux:
    name: Linux Desktop Build
    runs-on: ubuntu-latest

    needs:
      - quality

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Install Linux dependencies
      # --------------------------------------------------------

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev


      # --------------------------------------------------------
      # Setup Flutter
      # --------------------------------------------------------

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          cache: true
          cache-sdk: true


      # --------------------------------------------------------
      # Flutter dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: flutter pub get


      # --------------------------------------------------------
      # Build Linux
      # --------------------------------------------------------

      - name: Build Linux
        run: flutter build linux --release


      # --------------------------------------------------------
      # Upload Linux build
      # --------------------------------------------------------

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/x64/release/bundle


# ============================================================
# JOB 6 — WINDOWS BUILD
# ============================================================

  windows:
    name: Windows Desktop Build
    runs-on: windows-latest

    needs:
      - quality

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Setup Flutter
      # --------------------------------------------------------

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          cache: true
          cache-sdk: true


      # --------------------------------------------------------
      # Flutter dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: flutter pub get


      # --------------------------------------------------------
      # Build Windows
      # --------------------------------------------------------

      - name: Build Windows
        run: flutter build windows --release


      # --------------------------------------------------------
      # Upload Windows build
      # --------------------------------------------------------

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release


# ============================================================
# JOB 7 — macOS BUILD
# ============================================================

  macos:
    name: macOS Desktop Build
    runs-on: macos-latest

    needs:
      - quality

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Setup Flutter
      # --------------------------------------------------------

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          cache: true
          cache-sdk: true


      # --------------------------------------------------------
      # Flutter dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: flutter pub get


      # --------------------------------------------------------
      # Build macOS
      # --------------------------------------------------------

      - name: Build macOS
        run: flutter build macos --release


      # --------------------------------------------------------
      # Upload macOS build
      # --------------------------------------------------------

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/Build/Products/Release


# ============================================================
# JOB 8 — RELEASE BUILD
#
# Runs ONLY when you create a version tag:
#
# git tag v1.0.0
# git push origin v1.0.0
#
# ============================================================

  release:
    name: Production Release
    runs-on: ubuntu-latest

    # Release only runs for version tags.
    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - quality
      - android
      - ios
      - web
      - linux
      - windows
      - macos

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
